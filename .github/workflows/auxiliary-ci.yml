name: OJA-T Auxiliary DevOps CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Run RSpec
        run: bundle exec rspec

      - name: Check repository separation
        run: |
          test -f Gemfile
          test -f README.md

# Auxiliary repository only. This workflow does not deploy, activate live
# payment credentials, or change OJa-WA. OJA-T remains a separately governed
# execution repository maintained through DevOps and certification gates.
