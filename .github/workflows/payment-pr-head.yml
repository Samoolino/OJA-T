name: OJA-T Payment PR Head Verification

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Feature branch or commit SHA to verify"
        required: true
        default: "main"
  pull_request:

jobs:
  integrity:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oja_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oja_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oja_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Verify dependency graph
        run: bundle check
      - name: Check Ruby syntax
        shell: bash
        run: |
          set -euo pipefail
          find app config db test -type f -name '*.rb' -print0 | xargs -0 -n1 ruby -c
      - name: Prepare database
        run: bundle exec rails db:prepare
      - name: Run institutional tests
        run: bundle exec rails test test/institutional_controls_test.rb
      - name: Verify required contracts
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/INSTITUTIONAL_EXECUTION_CONTRACT.md
          test -f docs/FINANCIAL_INTEGRITY.md
          test -f docs/GEOGRAPHY_AND_LOCATION_POLICY.md
          test -f app/services/oja/financial/invariants.rb
          test -f app/services/oja/idempotency.rb
          test -f app/services/oja/geography/policy.rb
          test -f app/services/oja/settlement/eligibility.rb
