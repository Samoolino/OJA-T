name: OJA-T Integrity

on:
  push:
    branches: ["main", "feature/**", "institutional/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oja_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d oja_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/oja_test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Install dependencies
        run: bundle install --jobs 4 --retry 3
      - name: Check Ruby syntax
        shell: bash
        run: |
          set -euo pipefail
          find app config db test -type f -name '*.rb' -print0 | xargs -0 -n1 ruby -c
      - name: Prepare database
        run: bundle exec rails db:prepare
      - name: Run tests
        run: bundle exec rails test
      - name: Check required institutional contracts
        run: |
          test -f docs/INSTITUTIONAL_EXECUTION_CONTRACT.md
          test -f docs/FINANCIAL_INTEGRITY.md
          test -f docs/GEOGRAPHY_AND_LOCATION_POLICY.md
          test -f docs/DUAL_REPO_PARITY_CONTRACT.md
          test -f app/services/oja/financial/invariants.rb
          test -f app/services/oja/idempotency.rb
          test -f app/services/oja/geography/policy.rb
          test -f app/services/oja/allocation/authorization.rb
          test -f app/services/oja/settlement/eligibility.rb
          test -f app/services/oja/checkout/authorize_and_reserve.rb
          test -f app/services/oja/payment/capture_allocation.rb
          test -f test/transaction_path_test.rb
          test -f test/payment_capture_test.rb
